plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mwsguy.tv'
    compileSdk 34

    defaultConfig {
        applicationId "com.mwsguy.tv"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with the debug key so the release APK is installable (sideloading).
            // For Play Store publishing, replace with your own keystore.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
